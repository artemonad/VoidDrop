[package]
name = "voiddrop"
version = "0.1.0"
description = "End-to-end encrypted, zero-knowledge file sharing"
authors = ["VoidDrop"]
license = "MIT"
repository = "https://github.com/voiddrop/voiddrop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
rand = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
socket2 = "0.5.7"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
